<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Dialler — Voice Call</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
    .sub { color: #666; font-size: 0.85rem; margin-bottom: 1rem; }
    #log { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; height: 380px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 0.6rem; }
    .bubble { max-width: 80%; padding: 0.55rem 0.8rem; border-radius: 12px; font-size: 0.92rem; line-height: 1.35; white-space: pre-wrap; }
    .bot { align-self: flex-start; background: #e9e9eb; color: #1a1a1a; border-bottom-left-radius: 3px; }
    .rider { align-self: flex-end; background: #0b5fff; color: #fff; border-bottom-right-radius: 3px; }
    .system { align-self: center; color: #888; font-size: 0.8rem; font-style: italic; }
    .debug { align-self: center; background: #fff3cd; color: #664d03; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.72rem; padding: 0.3rem 0.6rem; border-radius: 6px; max-width: 95%; white-space: pre-wrap; }
    .controls { display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; }
    #mic { width: 84px; height: 84px; border-radius: 50%; border: none; font-size: 1.8rem; cursor: pointer; background: #0b5fff; color: #fff; }
    #mic.recording { background: #d81b1b; animation: pulse 1.2s infinite; }
    #mic:disabled { background: #ccc; cursor: default; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(216,27,27,0.5); } 70% { box-shadow: 0 0 0 14px rgba(216,27,27,0); } 100% { box-shadow: 0 0 0 0 rgba(216,27,27,0); } }
    #status { font-size: 0.9rem; color: #444; min-width: 140px; }
    button.secondary { background: #eee; color: #1a1a1a; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; margin-left: auto; }
    #answers { margin-top: 1.25rem; }
    #answers h2 { font-size: 1rem; }
    #answers ul { padding-left: 1.1rem; font-size: 0.88rem; }
    nav { font-size: 0.85rem; margin-bottom: 1rem; }
    nav a { color: #0b5fff; text-decoration: none; margin-right: 1rem; }
  </style>
</head>
<body>
  <nav><a href="/qa">Q&amp;A content</a><a href="/chat">Text call</a><a href="/voice">Voice call</a><a href="/voice/live">Live voice call</a><a href="/telephony">Telephony (Exotel)</a></nav>
  <h1>Voice call with a delivery partner</h1>
  <div class="sub">Click the mic, speak as the rider, click again to send. Uses Sarvam STT/TTS + Claude.</div>

  <div id="log"></div>

  <div class="controls">
    <button id="mic" disabled>🎤</button>
    <div id="status">Starting call...</div>
    <button id="restart" class="secondary">Start new call</button>
  </div>

  <div id="answers"></div>

  <audio id="player" hidden></audio>

  <script>
    const log = document.getElementById("log");
    const micBtn = document.getElementById("mic");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restart");
    const answersDiv = document.getElementById("answers");
    const player = document.getElementById("player");

    let mediaRecorder = null;
    let chunks = [];
    let recording = false;

    function addBubble(text, cls) {
      if (!text) return;
      const div = document.createElement("div");
      div.className = "bubble " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function addSystem(text) {
      const div = document.createElement("div");
      div.className = "bubble system";
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function setStatus(text) { statusEl.textContent = text; }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function addDebug(data) {
      const lines = [];
      if (data.tool_name) lines.push(`tool: ${data.tool_name}`);
      if (data.answer_summary) lines.push(`captured: "${data.answer_summary}"`);
      if (data.retrieved_context && data.retrieved_context.length) {
        lines.push("context used: " + data.retrieved_context.map(c => `"${c.question}"`).join(", "));
      }
      if (!lines.length) return;
      const div = document.createElement("div");
      div.className = "bubble debug";
      div.textContent = lines.join("\n");
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function renderAnswers(answers) {
      if (!answers || !answers.length) { answersDiv.innerHTML = ""; return; }
      const items = answers.map(a => `<li><strong>${escapeHtml(a.question)}</strong>: ${escapeHtml(a.answer)}</li>`).join("");
      answersDiv.innerHTML = `<h2>Collected answers</h2><ul>${items}</ul>`;
    }

    function playAudio(base64) {
      return new Promise((resolve) => {
        const blob = base64ToBlob(base64, "audio/wav");
        player.src = URL.createObjectURL(blob);
        player.hidden = false;
        player.onended = resolve;
        player.play().catch(() => resolve());
      });
    }

    function base64ToBlob(base64, mimeType) {
      const byteChars = atob(base64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      return new Blob([new Uint8Array(byteNumbers)], { type: mimeType });
    }

    async function safeJson(res) {
      try { return await res.json(); } catch (e) { return { error: `Server returned ${res.status} ${res.statusText}` }; }
    }

    async function startCall() {
      log.innerHTML = "";
      answersDiv.innerHTML = "";
      micBtn.disabled = true;
      setStatus("Dialling...");
      addSystem("Dialling...");

      try {
        const res = await fetch("/voice/start", { method: "POST" });
        const data = await safeJson(res);
        if (!res.ok) {
          addSystem(data.error || "Could not start call.");
          setStatus("Error");
          return;
        }
        addBubble(data.reply_text, "bot");
        setStatus("Playing greeting...");
        await playAudio(data.audio_base64);

        if (!data.ended) {
          micBtn.disabled = false;
          setStatus("Tap mic to speak");
        } else {
          setStatus("Call ended");
        }
      } catch (e) {
        addSystem("Error starting call: " + e.message);
        setStatus("Error");
      }
    }

    async function toggleRecording() {
      if (!recording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach((t) => t.stop());
            sendRecording();
          };
          mediaRecorder.start();
          recording = true;
          micBtn.classList.add("recording");
          setStatus("Recording... tap to stop");
        } catch (e) {
          addSystem("Microphone access denied or unavailable: " + e.message);
        }
      } else {
        mediaRecorder.stop();
        recording = false;
        micBtn.classList.remove("recording");
        micBtn.disabled = true;
        setStatus("Processing...");
      }
    }

    async function sendRecording() {
      const blob = new Blob(chunks, { type: "audio/webm" });
      const formData = new FormData();
      formData.append("audio", blob, "recording.webm");

      setStatus("Transcribing...");
      let transcriptData;
      try {
        const res = await fetch("/voice/transcribe", { method: "POST", body: formData });
        transcriptData = await safeJson(res);
        if (!res.ok) {
          addSystem(transcriptData.error || "Transcription failed.");
          micBtn.disabled = false;
          setStatus("Tap mic to speak");
          return;
        }
      } catch (e) {
        addSystem("Network error: " + e.message);
        micBtn.disabled = false;
        setStatus("Tap mic to speak");
        return;
      }

      // Show what the rider said immediately, before waiting on Claude + TTS.
      if (transcriptData.transcript) addBubble(transcriptData.transcript, "rider");
      setStatus("Thinking...");

      try {
        const res = await fetch("/voice/reply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: transcriptData.transcript, language_code: transcriptData.language_code }),
        });
        const data = await safeJson(res);
        if (!res.ok) {
          addSystem(data.error || "Something went wrong.");
          micBtn.disabled = false;
          setStatus("Tap mic to speak");
          return;
        }

        addDebug(data);
        addBubble(data.reply_text, "bot");
        renderAnswers(data.collected_answers);

        setStatus("Playing reply...");
        await playAudio(data.audio_base64);

        if (data.ended) {
          addSystem("Call ended.");
          setStatus("Call ended");
        } else {
          micBtn.disabled = false;
          setStatus("Tap mic to speak");
        }
      } catch (e) {
        addSystem("Network error: " + e.message);
        micBtn.disabled = false;
        setStatus("Tap mic to speak");
      }
    }

    micBtn.addEventListener("click", toggleRecording);
    restartBtn.addEventListener("click", startCall);

    startCall();
  </script>
</body>
</html>
